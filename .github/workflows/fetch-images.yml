name: fetch-images
on:
  push:
    paths: ["manifests/**.json", "!manifests/_failed.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: fetch-images
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow
      - run: python tools/fetch_images.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images manifests/_failed.json
          git diff --cached --quiet || git commit -m "Fetch product images"
          git pull --rebase origin main && git push
